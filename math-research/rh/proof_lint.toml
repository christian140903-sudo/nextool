# Proof-Lint-Katalog (RH). Jede Regel ist eine Prüffrage. Ein Knoten mit Status PROVED oder
# FORMALLY_VERIFIED auf dem MAIN-Pfad muss alle Regel-IDs in seinem Feld `lint` quittieren.
# Quittieren heißt: Die Frage wurde für diesen Knoten geprüft und die Antwort ist „nein, trifft nicht zu“.

[[rule]]
id = "L-01"
question = "Wird die Funktionalgleichung (oder eine Symmetrie) als Fixpunktbedingung Re ρ = 1/2 gelesen?"
test = "Gegenmodell Davenport–Heilbronn: gilt der Schritt dort auch? Dann ist er falsch."

[[rule]]
id = "L-02"
question = "Ersetzt numerische Evidenz (endlich viele Nullstellen/Koeffizienten) eine ∀-Aussage?"

[[rule]]
id = "L-03"
question = "Wird von 'fast alle', 'positive Dichte', 'Anteil 1' auf 'alle' geschlossen?"

[[rule]]
id = "L-04"
question = "Wird Einfachheit der Nullstellen stillschweigend angenommen?"

[[rule]]
id = "L-05"
question = "Werden Konturen über Pole/Nullstellen verschoben, ohne alle Residuen zu erfassen?"

[[rule]]
id = "L-06"
question = "Werden Summen/Integrale/Produkte/Grenzwerte ohne absolute oder gleichmäßige Konvergenz vertauscht?"

[[rule]]
id = "L-07"
question = "Gilt eine Ungleichung nur für festes T (oder festes L, festes n), während T→∞ gebraucht wird?"

[[rule]]
id = "L-08"
question = "Setzt eine benutzte Äquivalenz oder ein Import RH (oder etwas gleich Starkes) voraus?"

[[rule]]
id = "L-09"
question = "Wird eine asymptotische Entwicklung wie eine exakte Identität benutzt?"

[[rule]]
id = "L-10"
question = "Wird eine numerisch positive Größe ohne analytische untere Schranke als stets positiv behandelt?"

[[rule]]
id = "L-11"
question = "Wird ein Operator 'hermitesch' genannt ohne Domäne, Abschluss und Selbstadjungiertheit?"

[[rule]]
id = "L-12"
question = "Hat ein Modell nur ähnliche Statistik wie ζ, ohne exakte Identifikation mit ζ?"

[[rule]]
id = "L-13"
question = "Wird GRH oder eine andere stärkere Aussage angenommen statt bewiesen?"

[[rule]]
id = "L-14"
question = "Benutzt das Argument an keiner benannten Stelle das Eulerprodukt bzw. eine Eigenschaft, die Davenport–Heilbronn und Epstein(x²+5y²) fehlt? (RH-18)"
test = "computations/counter_models.py, computations/epstein_certify.py"

[[rule]]
id = "L-15"
question = "Gilt das Positivitätsargument für beliebige Multimengen (Bombieri–Lagarias) und ist damit nicht zeta-spezifisch?"

[[rule]]
id = "L-16"
question = "Hilbert–Pólya: Wird σ(A) ⊆ Nullstellen statt Nullstellen ⊆ σ(A) bewiesen?"

[[rule]]
id = "L-17"
question = "Hurwitz: Ist die lokal gleichmäßige Konvergenz auf einem Gebiet bewiesen, das alle möglichen Nullstellen enthält (|Im z| < 1/2), und haben die Approximanten dort nachweislich nur reelle Nullstellen?"

[[rule]]
id = "L-18"
question = "Wird eine als falsch bekannte Verschärfung benutzt (Mertens |M(x)|<√x; de-Branges-Positivität)?"

[[rule]]
id = "L-19"
question = "Rechnergestützte Schritte: Sind Konturen exakt geschlossen, alle Einschlüsse rigoros (Ball/Intervall), Präzision und Abbruch dokumentiert, zwei unabhängige Implementierungen?"
