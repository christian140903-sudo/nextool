<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">ANIMA Kernel — Durable cognitive state for AI agents</title>
  <desc id="desc">Open-source Python state engine with 446 tests and zero runtime dependencies.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080b12"/><stop offset="1" stop-color="#101827"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#54d8ff"/><stop offset=".55" stop-color="#8cdeff"/><stop offset="1" stop-color="#a879ff"/></linearGradient>
    <radialGradient id="glow" cx="75%" cy="15%" r="70%"><stop stop-color="#54d8ff" stop-opacity=".18"/><stop offset="1" stop-color="#54d8ff" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse"><path d="M72 0H0V72" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <g transform="translate(92 70)">
    <rect width="48" height="48" rx="14" fill="#54d8ff" fill-opacity=".08" stroke="#54d8ff" stroke-opacity=".45"/>
    <text x="24" y="32" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="20" font-weight="750" fill="#54d8ff">A</text>
    <text x="66" y="33" font-family="Inter,system-ui,sans-serif" font-size="22" font-weight="760" letter-spacing="4" fill="#f7f9fc">ANIMA KERNEL</text>
  </g>
  <text x="92" y="246" font-family="Inter,system-ui,sans-serif" font-size="72" font-weight="780" letter-spacing="-3" fill="#f7f9fc">Give agents a state</text>
  <text x="92" y="332" font-family="Inter,system-ui,sans-serif" font-size="72" font-weight="780" letter-spacing="-3" fill="url(#accent)">they can keep.</text>
  <text x="92" y="405" font-family="Inter,system-ui,sans-serif" font-size="24" fill="#9ba6b7">Durable state · Associative memory · Temporal context · Honest metrics</text>
  <g transform="translate(92 476)" font-family="Inter,system-ui,sans-serif">
    <rect width="146" height="42" rx="21" fill="#fff" fill-opacity=".035" stroke="#fff" stroke-opacity=".12"/>
    <circle cx="22" cy="21" r="4" fill="#53e6a7"/>
    <text x="38" y="27" font-size="15" font-weight="650" fill="#dce4ef">446 tests</text>
    <rect x="160" width="212" height="42" rx="21" fill="#fff" fill-opacity=".035" stroke="#fff" stroke-opacity=".12"/>
    <text x="182" y="27" font-size="15" font-weight="650" fill="#dce4ef">0 runtime dependencies</text>
    <rect x="386" width="112" height="42" rx="21" fill="#fff" fill-opacity=".035" stroke="#fff" stroke-opacity=".12"/>
    <text x="408" y="27" font-size="15" font-weight="650" fill="#dce4ef">MIT · v0.1.1</text>
  </g>
  <text x="1108" y="568" text-anchor="end" font-family="Inter,system-ui,sans-serif" font-size="17" fill="#707c8e">nextool.app/anima</text>
</svg>
