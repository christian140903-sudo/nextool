name: Site check

# npm test = build --check (site/ passt zu src/) + Linter v2 + Linter-Selbsttest.
# Die private Sperrliste (Arbeitgeber, Heimatort) kommt nur aus dem Repository-Secret
# SITE_PRIVATE_DENYLIST (Inhalt 1:1 wie die private Datei .site-private-denylist.txt); fehlt es oder
# bindet es nicht alle Regeln, meldet der Linter "NICHT GEPRÜFT" und setzt die Annotation
# "Sperrliste NICHT GEPRÜFT" am Lauf: Dann ist ein grüner Lauf KEIN Nachweis für die private Sperrliste.
# Treffer werden nie im Klartext ausgegeben. Die Zustandsdatei src/state.json ist privat und fehlt hier;
# der Linter prueft dann mit dem engsten Zustand (STATE_STRICT in scripts/lint-config.mjs).
# Release-Tor (R-03): Nur auf main laeuft zusaetzlich `npm run test:release`; es ist rot, solange
# <!--OFFEN:F-nn--> im Quelltext stehen und solange die Historie bekannte Sperrlisten-Treffer in
# Commit-Nachrichten enthaelt (COMMITS_KNOWN in lint-config; erst ein Repo ohne diese Historie ist frei).
# Branches und Pull Requests pruefen nur `npm test`, damit die
# normale CI nicht wegen fehlender Angaben dauerhaft rot ist. Das eigentliche Deploy-Tor ist der
# Build-Befehl `npm run test:release` in Cloudflare Pages; eine rote CI haelt Cloudflare nicht auf.

on:
  push:
    branches-ignore: ["archiv/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Commit-Nachrichten seit dem Relaunch werden mitgeprueft
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: npm test
        run: npm test
        env:
          SITE_PRIVATE_DENYLIST: ${{ secrets.SITE_PRIVATE_DENYLIST }}
      - name: Release-Tor (nur main)
        if: github.ref == 'refs/heads/main'
        run: npm run test:release
        env:
          SITE_PRIVATE_DENYLIST: ${{ secrets.SITE_PRIVATE_DENYLIST }}
