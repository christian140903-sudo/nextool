# Cloudflare Pages — Projekt "nextool" (per Git mit diesem Repository verbunden).
# Ausgeliefert wird NUR der Ordner site/ (erzeugt von `npm run build`, committet).
#
# Beleg (Doku gelesen 2026-10-08, developers.cloudflare.com/pages/functions/wrangler-configuration/):
#   "If using a Wrangler configuration file, you must treat your file as the source of truth
#    for your Pages project configuration." Pflichtschluessel: name, pages_build_output_dir,
#    compatibility_date. Wirksam ab dem naechsten Deployment (Git oder Direct Upload).
# Unsicherheit: Die Doku sagt nicht ausdruecklich, dass ein Git-ausgeloester Build damit das
# Dashboard-Feld "Build output directory" ersetzt; bei ungueltiger Datei wird sie laut
# Build-Log uebersprungen (fail-open). Deshalb zusaetzlich im Dashboard: Build output directory = site,
# Build command `npm run test:release` (Release-Tor R-03: prueft site/ gegen src/ und bricht ab, solange
# OFFEN-Kennungen F-nn offen sind; baut nichts, ausgeliefert wird das committete site/), Variable
# NODE_VERSION=22, Secret SITE_PRIVATE_DENYLIST, Vorschau-Deployments aus.
# Die Repo-Wurzel hat absichtlich KEINE index.html — wird diese Datei ignoriert, antwortet / mit 404
# statt mit Altbestand (Fehler sichtbar, nicht still).
name = "nextool"
pages_build_output_dir = "site"
compatibility_date = "2026-09-01"
